espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
lifecycleViewmodel = "2.9.0"
activityCompose = "1.13.0"
kotlin = "2.1.20"
kotlinxDatetime = "0.6.2"
composeBom = "2026.03.00"
appcompat = "1.7.1"
material = "1.13.0"
ktor = "3.4.2"
kotlinxSerializationJson = "1.8.1"
navigationCompose = "2.9.0"
coroutines = "1.10.2"
datastore = "1.1.4"
mapsCompose = "6.5.2"
playServicesLocation = "21.3.0"
